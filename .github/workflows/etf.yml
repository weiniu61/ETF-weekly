name: ETF Weekly Report

on:
  # 每周四自动运行
  schedule:
    - cron: "0 21 * * 4"

  # 允许手动测试运行
  workflow_dispatch:

jobs:
  etf-check:

    runs-on: ubuntu-latest

    steps:

      - name: 下载代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 安装需要的软件包
        run: |
          pip install yfinance pandas

      - name: 运行 ETF 检查
        run: |
          python etf_check.py
